# Mongo de dev como replica set de um nó: as transações do core exigem replica set.
# Para usar: DB_DRIVER=mongodb DB_HOST=localhost, sem DB_USER.
services:
  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo:/data/db
    healthcheck:
      test: mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }).ok }"
      interval: 5s
      retries: 10

volumes:
  mongo:
